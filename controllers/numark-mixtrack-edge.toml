# Numark Mixtrack Edge
# Am Gerät aufgezeichnet (MIDI-Monitor, alle Bedienelemente der Reihe nach, 11.11.2026).
# Kanal 1 = Mitte, Kanal 2 = Deck 1 (links), Kanal 3 = Deck 2 (rechts).
# SHIFT (Note 0x26) ändert die Codes nicht: die SHIFT-Ebene steht hier als
# `shift = true`. Die FX-Taste (Note 0x1F, schaltet im Gerät um) und die
# Jog-Modus-Tasten wechseln die Codes im Gerät selbst: jeder Jog-Modus sendet
# einen eigenen CC (Cue Mix 0x27, Browse 0x26, Pitch 0x25, Scratch 0x28,
# Search 0x29); mit FX an senden Sample-Tasten 0x1E/0x1D/0x1C (FX −/+/an) und
# TREBLE/BASS CC 0x0C/0x0D (Effekt-Regler). Kein Pitch-Fader: Tempo per Jog
# mit gehaltener PITCH-Taste. Jogs zählen rechts herum negativ → invert.

name = "Numark Mixtrack Edge"
# Bei jeder Änderung hochzählen (Online-Profile ersetzen nur ältere).
revision = 4
port = "Mixtrack Edge"
jog_ticks_per_rev = 600.0
note = "Am Gerät aufgezeichnet. Tempo: PITCH halten und Jog drehen (mit SHIFT fein). Scratch: FX an + BROWSE."
audio = "Mixtrack Edge"
led_on = 0x7F
led_off = 0x00
# SYNC blinkt im Takt des laufenden Titels (mit Sync-Lock: dauerhaft an).
sync_beat_light = true

