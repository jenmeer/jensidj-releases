# Numark Party Mix III
# Aufgezeichnet am Gerät (MIDI-Monitor, alle Bedienelemente der Reihe nach),
# Nummernschema wie Mixxx' Party-Mix-Zuordnung. Beschriftung laut Gerätefoto:
# MODE (gehalten = SHIFT) Note 0x00 Kanal 5/6, ACAPELLA 0x46 / INSTRUMENTAL 0x48
# Kanal 1/2, FADE FX Note 0x46 Kanal 16, LEVEL (Kopfhörer) CC 0x0C Kanal 16.

name = "Numark Party Mix III"
port = "Party Mix"
jog_ticks_per_rev = 600.0
note = "Am Gerät aufgezeichnet. ACAPELLA/INSTRUMENTAL wirken ab E7 (Stems)"
# Beim Verbinden: MIDI Identity Request. Er beendet das Demo-Lauflicht des
# Party Mix III (am Gerät getestet). Die Numark-SysEx F0 00 01 3F 5C 48 F7 und die
# "Party-Lichter aus"-CCs (0x40/0x42/0x43) des Party Mix I wirken beim III nicht.
init = [[0xF0, 0x7E, 0x7F, 0x06, 0x01, 0xF7]]
# Eigener Audio-Ausgang (Master 1/2, Kopfhörer 3/4), wird automatisch gewählt.
audio = "Party Mix"
# Wie in VirtualDJ: alle Lampen mit Funktion leuchten schwach (1), aktive hell (2).
led_on = 0x02
# Inaktive Lampen schwach (1).
led_off = 0x01

