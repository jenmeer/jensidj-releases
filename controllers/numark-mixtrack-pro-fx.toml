# Numark Mixtrack Pro FX
# Werte aus der Mixxx-Zuordnung "Numark Mixtrack Pro FX.midi.xml" und
# "Numark-Mixtrack-Pro-FX-scripts.js" (res/controllers im Mixxx-Repository).
# Noch am Gerät zu prüfen: Richtung des Pitch-Faders (Mixxx liest ihn 14-bit
# aus CC 0x09 + 0x29; hier nur das MSB 0x09).

name = "Numark Mixtrack Pro FX"
port = "MixTrack Pro FX"
# Mixxx: jogScratchSensitivity = 1024 Schritte pro Umdrehung
jog_ticks_per_rev = 1024.0
note = "Nach Mixxx-Zuordnung – Pitch-Richtung und FX-Schalter noch prüfen"
# Mixxx init(): Demo-Lichtshow aus, Pad-Modus "Fader Cuts" freischalten, Status.
init = [[0xF0, 0x7E, 0x00, 0x06, 0x01, 0xF7], [0xF0, 0x00, 0x20, 0x7F, 0x03, 0xF7], [0xF0, 0x00, 0x20, 0x7F, 0x03, 0x01, 0xF7]]
# Eigener Audio-Ausgang (Master 1/2, Kopfhörer 3/4), wird automatisch gewählt.
audio = "Mixtrack Pro FX"
led_on = 0x7F
# Mixxx dimmt inaktive Tasten mit 0x01 statt sie auszuschalten.
led_off = 0x01

