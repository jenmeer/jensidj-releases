# Numark Mixtrack Pro FX
# Am Gerät aufgezeichnet (21.11.2026, geführte Aufnahme `examples/controller_capture`,
# Rohdaten in docs/controller-aufnahmen/mixtrack-pro-fx-teil1.txt und -teil2.txt).
# Decks: Kanal 1/2 (Transport, Mixer), Pads Kanal 5/6, Effekt-Einheit Kanal 9/10,
# Mitte Kanal 15/16. SHIFT (Note 0x20) schaltet im Gerät um: mit SHIFT senden die
# Tasten andere Noten (darum hier ohne `shift = true`).
# Pitch-Fader: 14 Bit (CC 0x09 grob + 0x29 fein), genutzt wird 0x09; Ende mit dem
# Plus-Aufdruck = 127; am Gerät getestet läuft der Fader nur mit `invert` richtig
# (Nutzer 21.11.2026). Jog: im Uhrzeigersinn 1, 2 …, dagegen 127, 126 …
# FX-Hebel: CC 0x03 Kanal 9 (links) / 10 (rechts), 0 = Mitte, 1 = HOLD, 2 = ON.

name = "Numark Mixtrack Pro FX"
port = "MixTrack Pro FX"
revision = 3
jog_ticks_per_rev = 1024.0
note = "Am Gerät aufgezeichnet (21.11.2026). TAP und der MIC-Regler sind nicht belegt"
# Demo-Lichtshow aus, Pad-Modus freischalten, Stellung aller Regler abfragen.
init = [[0xF0, 0x7E, 0x00, 0x06, 0x01, 0xF7], [0xF0, 0x00, 0x20, 0x7F, 0x03, 0xF7], [0xF0, 0x00, 0x20, 0x7F, 0x03, 0x01, 0xF7]]
# Eigener Audio-Ausgang (Master 1/2, Kopfhörer 3/4), wird automatisch gewählt.
audio = "Mixtrack Pro FX"
led_on = 0x7F
led_off = 0x01
sync_beat_light = true

